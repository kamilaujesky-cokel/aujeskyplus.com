  .hero__veil{
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse 58% 46% at 50% 50%, rgba(0,0,0,.52) 0%, rgba(0,0,0,.30) 55%, rgba(0,0,0,0) 100%),
      linear-gradient(rgba(0,0,0,.12), rgba(0,0,0,.55) 96%);
  }
  .hero__logo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 6vw}
  .hero__logo svg{width:min(560px,72vw);height:auto;display:block;opacity:0;animation:reveal 1.6s cubic-bezier(.16,1,.3,1) .3s forwards}
  .hero__cue{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);width:14px;height:14px;opacity:.55}
  @keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.hero__logo svg{opacity:1;animation:none}}

  .projects{padding:120px 6vw 40px;max-width:1440px;margin:0 auto;border-bottom-width:0}
  .projects .row:first-child{border-top:1px solid var(--line)}

  .row{
    display:flex;align-items:baseline;gap:22px;
    padding:34px 10px;border-bottom:1px solid var(--line);
    text-decoration:none;color:var(--white);
    transition:background .18s ease,color .18s ease;
  }
  .row__plus{
    width:.5em;height:.5em;flex:none;align-self:center;
    opacity:0;transform:translateX(-6px);
    transition:opacity .18s ease,transform .18s ease;
    font-size:clamp(28px,4.6vw,58px);
  }
  .row__name{
    font-size:clamp(28px,4.6vw,58px);
    font-weight:600;line-height:1.1;
    text-transform:uppercase;white-space:nowrap;
  }
  .row__cat{margin-left:auto;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);flex:none}
  .row:hover,.row:focus-visible{background:var(--white);color:var(--black)}
  .row:hover .row__cat,.row:focus-visible .row__cat{color:rgba(0,0,0,.6)}
  .row:hover .row__plus,.row:focus-visible .row__plus{opacity:1;transform:none}
  .row:focus-visible{outline:2px solid var(--white);outline-offset:-2px}
  @media (prefers-reduced-motion: reduce){.row,.row__plus{transition:none}}
  @media (max-width:640px){
    .hero__bg{background-position:68% center}
    .hero__logo svg{width:80vw}
    .projects{padding:80px 24px 24px}
    .row{gap:14px;padding:26px 4px}
    .row__name{white-space:normal}
    .row__cat{display:none}
  }

  .footer{max-width:1440px;margin:0 auto;padding:100px 6vw 44px;display:flex;justify-content:center;align-items:baseline}
  .footer__l{display:flex;align-items:center}.footer__l svg{height:13px;width:auto;display:block;opacity:.85}
  @media (max-width:640px){.footer{padding:70px 24px 32px}}
</style>
</head>
